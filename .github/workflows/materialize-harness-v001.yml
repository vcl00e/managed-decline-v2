name: Materialize Narrative Interaction Harness v001

on:
  push:
    branches:
      - infrastructure/narrative-interaction-harness-v001
    paths:
      - '.github/workflows/materialize-harness-v001.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: infrastructure/narrative-interaction-harness-v001
          fetch-depth: 0

      - name: Extract tested harness
        shell: bash
        run: |
          set -euo pipefail
          cat .materialize/harness-*.b64 | base64 --decode > /tmp/narrative-interaction-harness-v001.tar.gz
          tar -tzf /tmp/narrative-interaction-harness-v001.tar.gz >/dev/null
          tar -xzf /tmp/narrative-interaction-harness-v001.tar.gz

      - name: Verify before commit
        shell: bash
        run: |
          set -euo pipefail
          cd prototypes/narrative-interaction-harness-v001
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          export CHROMIUM_PATH="$browser"
          "$browser" --version
          npm test
          npm run audit:v007d-fixture

      - name: Remove one-use staging and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .materialize
          rm -f .github/workflows/materialize-harness-v001.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Add stable narrative interaction harness v001"
          git push origin HEAD:infrastructure/narrative-interaction-harness-v001
