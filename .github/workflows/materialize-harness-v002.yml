name: Materialize Narrative Interaction Harness v002

on:
  push:
    branches:
      - infrastructure/narrative-interaction-harness-v002
    paths:
      - '.github/workflows/materialize-harness-v002.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: infrastructure/narrative-interaction-harness-v002
          fetch-depth: 0
      - name: Extract verified harness source
        shell: bash
        run: |
          set -euo pipefail
          cat .materialize/harness-v002-*.b64 | base64 --decode > /tmp/harness-v002.tar.gz
          echo '4f70808ec1dedefe6be6a306a6c9a3e58cc687928c9fe40730e876bb2eab0b20  /tmp/harness-v002.tar.gz' | sha256sum -c -
          tar -tzf /tmp/harness-v002.tar.gz >/dev/null
          tar -xzf /tmp/harness-v002.tar.gz
      - name: Verify exact extracted source
        shell: bash
        run: |
          set -euo pipefail
          cd prototypes/narrative-interaction-harness-v002
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$browser"
          export CHROMIUM_PATH="$browser"
          npm test
      - name: Commit source and remove staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .materialize
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A prototypes/narrative-interaction-harness-v002 .materialize
          git diff --cached --check
          git commit -m 'Add scenario-pluggable narrative interaction harness v002'
          git push origin HEAD:infrastructure/narrative-interaction-harness-v002

# retry after corrected staging chunks
