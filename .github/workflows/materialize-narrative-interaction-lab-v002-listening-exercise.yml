name: Materialize Listening Exercise v002

on:
  push:
    branches:
      - prototype/narrative-interaction-lab-v002-listening-exercise
    paths:
      - '.prototype-upload/narrative-interaction-lab-v002/**'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact runtime sources
        shell: bash
        run: |
          set -euo pipefail
          src='.prototype-upload/narrative-interaction-lab-v002'
          dst='prototypes/narrative-interaction-lab-v002'

          base64 -d "$src/app.js.gz.b64.00" | gzip -dc > "$dst/app.js"
          cat "$src"/story.mjs.gz.b64.* | base64 -d | gzip -dc > "$dst/story.mjs"
          base64 -d "$src/styles.css.gz.b64" | gzip -dc > "$dst/styles.css"
          base64 -d "$src/validate.mjs.gz.b64" | gzip -dc > "$dst/validate.mjs"

          test "$(git hash-object "$dst/app.js")" = '7e8af6ffb89609f405ee57c95d833e9140c25e6b'
          test "$(git hash-object "$dst/story.mjs")" = '02f318272eab2f824158f3c269b52c198bff1b10'
          test "$(git hash-object "$dst/styles.css")" = '6f63bfcbba50c5656091f0650a251c515644e08a'
          test "$(git hash-object "$dst/validate.mjs")" = '604d0a93be3e5b8bcbabb429346caefda30457ec'

      - name: Validate prototype
        working-directory: prototypes/narrative-interaction-lab-v002
        run: npm test

      - name: Commit materialized sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prototypes/narrative-interaction-lab-v002/app.js \
                  prototypes/narrative-interaction-lab-v002/story.mjs \
                  prototypes/narrative-interaction-lab-v002/styles.css \
                  prototypes/narrative-interaction-lab-v002/validate.mjs
          git rm -r .prototype-upload/narrative-interaction-lab-v002
          git commit -m 'Materialize Listening Exercise runtime sources'
          git push origin HEAD:prototype/narrative-interaction-lab-v002-listening-exercise
