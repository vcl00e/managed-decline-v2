name: Materialize v007c

on:
  push:
    branches:
      - prototype/narrative-interaction-lab-v007c

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize tested v007c implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .materialize/v007c/* | base64 -d > /tmp/v007c.tgz
          mkdir -p prototypes/narrative-interaction-lab-v007c
          tar -xzf /tmp/v007c.tgz -C prototypes/narrative-interaction-lab-v007c
          rm -rf .materialize
          rm -f .github/workflows/materialize-v007c.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Materialize v007c tested implementation'
          git push
