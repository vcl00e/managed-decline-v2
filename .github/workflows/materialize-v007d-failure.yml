name: Archive v007d external failure evidence

on:
  push:
    branches:
      - prototype/narrative-interaction-lab-v007d
    paths:
      - '.github/workflows/materialize-v007d-failure.yml'

permissions:
  contents: write

jobs:
  archive:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/narrative-interaction-lab-v007d
          fetch-depth: 0

      - name: Restore and validate exact uploaded trace
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .materialize/v007d-trace.json.gz.b64 | gzip -dc > prototypes/narrative-interaction-lab-v007d/findings/managed-decline-v007d-traces-2026-08-29.json
          python -m json.tool prototypes/narrative-interaction-lab-v007d/findings/managed-decline-v007d-traces-2026-08-29.json >/dev/null

      - name: Mark the prototype failed
        shell: python
        run: |
          from pathlib import Path
          path = Path('prototypes/narrative-interaction-lab-v007d/README.md')
          text = path.read_text()
          old = '**Status:** ready for external playtest — exact-branch checks and dyadic whole-play preflight passed'
          new = '**Status:** failed external playtest — archived; do not patch forward'
          if old not in text and new not in text:
              raise SystemExit('Expected v007d status line not found')
          text = text.replace(old, new)
          marker = '**External failure:** [`findings/001-2026-08-29-external-playtest-unplayable.md`](./findings/001-2026-08-29-external-playtest-unplayable.md)\n\n'
          process = '**Process:** governed by [`../PROTOTYPE-POLICY.md`](../PROTOTYPE-POLICY.md)\n\n'
          if marker not in text:
              text = text.replace(process, process + marker)
          path.write_text(text)

      - name: Remove staging and commit archival record
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .materialize
          rm -f .github/workflows/materialize-v007d-failure.yml
          rm -f prototypes/narrative-interaction-lab-v007d/findings/.trace-materialization-note
          rm -f prototypes/narrative-interaction-lab-v007d/findings/managed-decline-v007d-traces-2026-08-29.README.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Archive v007d failed external playtest"
          git push origin HEAD:prototype/narrative-interaction-lab-v007d
