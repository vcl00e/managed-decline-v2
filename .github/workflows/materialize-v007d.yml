name: Materialize v007d

on:
  push:
    branches:
      - prototype/narrative-interaction-lab-v007d
    paths:
      - '.github/workflows/materialize-v007d.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/narrative-interaction-lab-v007d
          fetch-depth: 0

      - name: Extract tested v007d build
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .materialize/v007d-build.b64 > /tmp/v007d.tar.gz
          tar -tzf /tmp/v007d.tar.gz >/dev/null
          mkdir -p prototypes/narrative-interaction-lab-v007d
          tar -xzf /tmp/v007d.tar.gz -C prototypes/narrative-interaction-lab-v007d

      - name: Remove one-use staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .materialize
          rm -f .github/workflows/materialize-v007d.yml

      - name: Commit tested build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Implement v007d dyadic interaction grammar"
          git push origin HEAD:prototype/narrative-interaction-lab-v007d
