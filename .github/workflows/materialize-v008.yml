name: Materialize Narrative Interaction Lab v008

on:
  push:
    branches:
      - prototype/narrative-interaction-lab-v008
    paths:
      - '.github/workflows/materialize-v008.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/narrative-interaction-lab-v008
          fetch-depth: 0
      - name: Extract verified v008 source
        shell: bash
        run: |
          set -euo pipefail
          cat .materialize/v008-*.b64 | base64 --decode > /tmp/v008.tar.gz
          echo '153493f634a2585356afb8aeaab90c48552ba7b2aa497ed842bfe6e968b84301  /tmp/v008.tar.gz' | sha256sum -c -
          tar -tzf /tmp/v008.tar.gz >/dev/null
          tar -xzf /tmp/v008.tar.gz
      - name: Verify exact extracted v008 source
        shell: bash
        run: |
          set -euo pipefail
          cd prototypes/narrative-interaction-lab-v008
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$browser"
          export CHROMIUM_PATH="$browser"
          npm test
      - name: Commit source and remove staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .materialize
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A prototypes/narrative-interaction-lab-v008 .materialize
          git diff --cached --check
          git commit -m 'Add narrative interaction lab v008 The Old Build'
          git push origin HEAD:prototype/narrative-interaction-lab-v008
