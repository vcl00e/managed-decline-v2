name: Narrative Interaction Harness v003 Baseline Recovery

on:
  push:
    branches:
      - infrastructure/narrative-interaction-baseline-recovery
  pull_request:
    paths:
      - 'prototypes/narrative-interaction-harness-v003/**'
      - 'prototypes/narrative-interaction-lab-v008/**'
      - '.github/workflows/narrative-interaction-harness-v003.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/narrative-interaction-harness-v003
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Locate Chromium
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$browser"
          echo "CHROMIUM_PATH=$browser" >> "$GITHUB_ENV"
          "$browser" --version
      - name: Golden-baseline control and rendered presentation
        run: npm test
      - name: HTTP smoke
        shell: bash
        run: |
          set -euo pipefail
          node server.mjs >/tmp/md-harness-v003.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4190/ | grep -q 'Baseline Recovery Control'; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/md-harness-v003.log
          exit 1
