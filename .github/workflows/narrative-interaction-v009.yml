name: Narrative Interaction Lab v009

on:
  push:
    branches:
      - prototype/narrative-interaction-lab-v009
  pull_request:
    paths:
      - 'prototypes/narrative-interaction-lab-v009/**'
      - '.github/workflows/narrative-interaction-v009.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/narrative-interaction-lab-v009
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Locate Chromium
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$browser"
          echo "CHROMIUM_PATH=$browser" >> "$GITHUB_ENV"
          "$browser" --version
      - name: Interaction, comprehension, recovered-UX and rendered-client gates
        run: npm test
      - name: HTTP smoke
        shell: bash
        run: |
          set -euo pipefail
          node server.mjs >/tmp/md-v009.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4199/ | grep -q 'Two Pictures'; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/md-v009.log
          exit 1
