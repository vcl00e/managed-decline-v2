name: Narrative Interaction Lab v010b

on:
  push:
    branches:
      - prototype/narrative-interaction-lab-v010b
  pull_request:
    paths:
      - 'prototypes/narrative-interaction-lab-v010b/**'
      - '.github/workflows/narrative-interaction-v010b.yml'

jobs:
  verify:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: prototypes/narrative-interaction-lab-v010b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locate Chromium
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$browser"
          echo "CHROMIUM_PATH=$browser" >> "$GITHUB_ENV"
          "$browser" --version
      - name: Formation, live narration, acknowledgement, density and rendered-client gates
        run: npm test
      - name: HTTP smoke
        shell: bash
        run: |
          set -euo pipefail
          node server.mjs >/tmp/v010b-server.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4211/ >/dev/null; then
              exit 0
            fi
            sleep .1
          done
          cat /tmp/v010b-server.log
          exit 1
